# Active Profile Default (Points to MS SQL Server for production/local runtime)
spring.profiles.active=dev

server.address=0.0.0.0
server.port=8000

# Common App Settings
spring.application.name=WordSanitizerApi
spring.jpa.show-sql=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html